[project]
name = "blender-mcp-bridge"
version = "1.0.0"
description = "CLI bridge from Hermes to the official Blender Lab MCP server (raw bpy execution over null-byte-framed JSON on TCP 9876)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blender-mcp = "blender_mcp_bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp_bridge"]
